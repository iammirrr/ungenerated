<!doctype html>
<html lang="en" data-base="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="../home.css">
<link rel="stylesheet" href="../skill.css">
</head>
<body>

<header class="top" id="top">
  <div class="wrap top-in">
    <a class="logo" href="../">Ungenerated</a>
    <nav class="nav" aria-label="Sections">
      <a href="../#projects">Projects</a>
      <a href="../#skills">Skills</a>
      <a href="{{REPO}}">GitHub</a>
    </nav>
  </div>
</header>

<main class="wrap sk-page">
  <aside class="sk-side" aria-label="All skills">{{SIDE}}</aside>
  <article class="sk-main">
    <p class="sk-group">{{GROUP}}</p>
    <h1 class="sk-title">{{NAME}}</h1>
    <p class="sk-lede">{{LEDE}}</p>
    <p class="sk-meta">{{META}}</p>
    {{EXAMPLE}}
    <div class="prose">{{BODY}}</div>
    <nav class="pager" aria-label="Skills in order">{{PAGER}}</nav>
  </article>
</main>

<footer class="foot">
  <div class="wrap foot-in"><span>Rebuilt from <a href="{{REPO}}">the repository</a> on every change · {{WHEN}} · <a href="{{REPO}}/commit/{{COMMIT}}">{{COMMIT}}</a></span><span>MIT licence</span></div>
</footer>
<script>{{DATA}}</script>
<script src="../flows.js"></script>
<script src="../page.js"></script>
</body>
</html>
